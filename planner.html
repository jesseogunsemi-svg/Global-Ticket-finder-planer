<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plot a Plot — Travel Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0f1220" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
  :root{--bg:#0f1220;--card:#181c30;--card2:#252b4a;--text:#f2f3ff;--muted:#9aa0c3;--accent:#6c5ce7;--accent-hover:#7d6df0;--accent2:#00cec9;--green:#00b894;--red:#ff7675;--border:#2c3157;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0b0d1a;background-image:radial-gradient(circle at 12% 18%,rgba(0,206,201,0.30),transparent 40%),radial-gradient(circle at 88% 16%,rgba(108,92,231,0.32),transparent 42%),radial-gradient(circle at 78% 88%,rgba(232,67,147,0.28),transparent 42%),radial-gradient(circle at 18% 86%,rgba(39,174,96,0.24),transparent 42%),radial-gradient(circle at 50% 50%,rgba(231,76,60,0.10),transparent 60%);background-attachment:fixed;color:var(--text);min-height:100vh;padding:16px;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:780px;margin:0 auto;}
  header{text-align:center;margin:22px 0 14px;}
  header h1{font-size:34px;font-weight:800;letter-spacing:-1px;}
  header h1 span{color:var(--accent2);}
  header p{color:var(--muted);margin-top:8px;font-size:14px;}
  .nav{text-align:center;margin-bottom:16px;}
  .nav a{color:var(--accent2);font-size:13px;text-decoration:none;}
  .controls{background:rgba(24,28,48,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.10);border-radius:20px;padding:22px;box-shadow:0 18px 60px rgba(0,0,0,0.45);}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .field{flex:1;min-width:140px;}
  label{font-size:12px;font-weight:500;color:var(--muted);display:block;margin-bottom:6px;}
  input,select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:15px;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,92,231,0.25);}
  textarea{min-height:60px;resize:vertical;margin-top:0;}
  .block{margin-top:14px;}

  /* Interest tags */
  .tags{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
  .tag{--c:#6c5ce7;display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 10px;border-radius:12px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);color:#fff;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .15s;user-select:none;}
  .tag:hover{background:color-mix(in srgb,var(--c) 26%,transparent);}
  .tag.active{background:color-mix(in srgb,var(--c) 38%,transparent);box-shadow:0 0 0 2px var(--c) inset,0 0 18px color-mix(in srgb,var(--c) 55%,transparent);}
  .tag[data-tag="Sports"]{--c:#e67e22;}
  .tag[data-tag="Concerts"]{--c:#e84393;}
  .tag[data-tag="Arts & Theatre"]{--c:#7c5cd6;}
  .tag[data-tag="Attractions"]{--c:#27ae60;}
  .tag[data-tag="Theme Parks"]{--c:#e74c3c;}
  .tag[data-tag="Travel Experiences"]{--c:#00cec9;}
  .tag[data-tag="Food"]{--c:#f39c12;}

  .btn{width:100%;margin-top:20px;padding:15px;border:none;border-radius:12px;background:linear-gradient(90deg,#6c5ce7,#a142d6,#e84393);background-size:200% 100%;color:#fff;font-size:16px;font-weight:700;cursor:pointer;transition:background-position .3s,transform .1s,box-shadow .15s;box-shadow:0 8px 24px rgba(161,66,214,0.35);}
  .btn:hover{background-position:100% 0;box-shadow:0 10px 30px rgba(232,67,147,0.45);}
  .btn:active{transform:scale(0.99);}
  .btn:disabled{opacity:0.6;cursor:default;}
  .status{font-size:13px;color:var(--muted);margin-top:10px;min-height:18px;text-align:center;}
  .spinner{border:3px solid var(--border);border-top:3px solid var(--accent);border-radius:50%;width:26px;height:26px;animation:spin 0.8s linear infinite;margin:24px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .summary{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:18px;}
  .summary h2{font-size:18px;margin-bottom:8px;}
  .summary p{color:var(--muted);font-size:14px;line-height:1.5;}

  .budget{margin-top:14px;}
  .budget .bartrack{background:var(--card2);border-radius:999px;height:14px;overflow:hidden;border:1px solid var(--border);}
  .budget .barfill{height:100%;background:var(--green);transition:width .4s;}
  .budget .barfill.over{background:var(--red);}
  .budget .line{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--muted);}
  .budget .line b{color:var(--text);}
  .breakdown{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .chip{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);}
  .chip b{color:var(--text);}

  .day{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-top:14px;}
  .day h3{font-size:16px;margin-bottom:2px;}
  .day .dnum{color:var(--accent2);font-size:12px;text-transform:uppercase;letter-spacing:1px;}
  .item{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-top:1px solid var(--border);}
  .item:first-of-type{border-top:none;}
  .ico{font-size:18px;width:26px;text-align:center;flex:0 0 auto;}
  .item .body{flex:1;}
  .item .name{font-size:15px;font-weight:600;}
  .item .detail{color:var(--muted);font-size:13px;margin-top:2px;}
  .item .cost{font-size:13px;color:var(--green);margin-top:2px;}
  .item a.book{flex:0 0 auto;align-self:center;text-decoration:none;background:var(--accent);color:#fff;font-size:13px;font-weight:600;padding:8px 12px;border-radius:8px;white-space:nowrap;}
  .empty{text-align:center;color:var(--muted);padding:26px 10px;line-height:1.6;}
  .note{color:var(--muted);font-size:12px;text-align:center;margin:22px 0 8px;line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Plot a <span>Plot</span></h1>
    <p>Tell us your budget &amp; interests — get a day-by-day plan with real booking links.</p>
  </header>
  <div class="nav"><a href="index.html">→ Switch to the Ticket Finder</a></div>

  <div class="controls">
    <div class="row">
      <div class="field"><label for="origin">From</label><input id="origin" placeholder="e.g. Calgary, Canada" /></div>
      <div class="field"><label for="destination">Destination</label><input id="destination" placeholder="e.g. Paris, France" /></div>
    </div>
    <div class="row block">
      <div class="field" style="max-width:120px;"><label for="days">Days</label><input id="days" type="number" min="1" max="30" value="5" /></div>
      <div class="field"><label for="budget">Total budget</label><input id="budget" type="number" min="0" value="2000" /></div>
      <div class="field" style="max-width:120px;"><label for="currency">Currency</label>
        <select id="currency"><option>CAD</option><option>USD</option><option>EUR</option><option>GBP</option><option>AUD</option></select>
      </div>
    </div>
    <div class="row block">
      <div class="field" style="max-width:140px;"><label for="party">Travellers</label><input id="party" type="number" min="1" max="20" value="2" /></div>
      <div class="field"><label for="pace">Pace</label>
        <select id="pace"><option value="relaxed">Relaxed</option><option value="balanced" selected>Balanced</option><option value="packed">Packed</option></select>
      </div>
    </div>
    <div class="block">
      <label>Your interests <span style="color:var(--muted);font-weight:400;">(pick any)</span></label>
      <div class="tags" id="tags">
        <button type="button" class="tag" data-tag="Sports">⚽ Sports</button>
        <button type="button" class="tag" data-tag="Concerts">🎸 Concerts</button>
        <button type="button" class="tag" data-tag="Arts &amp; Theatre">🎭 Arts &amp; Theatre</button>
        <button type="button" class="tag" data-tag="Attractions">🗼 Attractions</button>
        <button type="button" class="tag" data-tag="Theme Parks">🎢 Theme Parks</button>
        <button type="button" class="tag" data-tag="Travel Experiences">🧳 Travel Experiences</button>
        <button type="button" class="tag" data-tag="Food">🍽️ Food</button>
      </div>
    </div>
    <button class="btn" id="plan">Plan my trip</button>
    <div class="status" id="status"></div>
  </div>

  <div id="results"></div>

  <p class="note">
    Itineraries are AI-generated estimates tailored to your budget &amp; interests.<br>
    Prices are approximate — tap any <b>Book</b> button to see live prices and reserve on the real site.
  </p>
</div>

<script>
function el(id){return document.getElementById(id);}
function setStatus(m){el("status").textContent=m||"";}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}

var ICONS={flight:"✈️",hotel:"🏨",restaurant:"🍽️",attraction:"🎟️",event:"🎤"};

// Interest tags — toggle active state, collect selected labels.
var selectedTags=[];
Array.prototype.forEach.call(document.querySelectorAll(".tag"),function(btn){
  btn.addEventListener("click",function(){
    btn.classList.toggle("active");
    var t=btn.getAttribute("data-tag");
    var i=selectedTags.indexOf(t);
    if(i>=0) selectedTags.splice(i,1); else selectedTags.push(t);
  });
});

// Build a REAL booking/search link based on the item type (the AI never invents URLs).
function bookLink(item, dest, origin){
  var q=encodeURIComponent;
  var name=item.name||"";
  var query=item.bookQuery||name;
  switch(item.type){
    case "flight":
      var fc=(item.fromCode||"").toString().trim().toUpperCase();
      var tc=(item.toCode||"").toString().trim().toUpperCase();
      if(/^[A-Z]{3}$/.test(fc) && /^[A-Z]{3}$/.test(tc)){
        var dt=new Date(Date.now()+30*86400000).toISOString().slice(0,10); // ~30 days out so Kayak shows real results
        return "https://www.kayak.com/flights/"+fc+"-"+tc+"/"+dt+"?sort=price_a"; // real dated flight search on Kayak
      }
      return "https://www.bing.com/search?q="+q("flights from "+(origin||"")+" to "+dest); // fallback
    case "hotel":    return "https://www.booking.com/searchresults.html?ss="+q(query+" "+dest);
    case "restaurant":return "https://www.tripadvisor.com/Search?q="+q(name+" "+dest);
    case "event":    return "https://www.ticketmaster.com/search?q="+q(name);
    case "attraction":
    default:         return "https://www.getyourguide.com/s/?q="+q(query+" "+dest);
  }
}

function money(cur,n){ if(typeof n!=="number"||isNaN(n)) return ""; return cur+" "+Math.round(n).toLocaleString(); }

function renderPlan(plan, dest, origin){
  var cur=plan.currency||"";
  var budget=parseInt(el("budget").value,10)||0;
  var total=plan.totalEstimate||0;
  var pct=budget?Math.min(100,Math.round(total/budget*100)):0;
  var over=budget&&total>budget;

  var html="";
  // Summary + budget bar
  html+='<div class="summary">';
  html+='<h2>'+esc(dest)+' · '+(plan.days?plan.days.length:0)+'-day plan</h2>';
  if(plan.summary) html+='<p>'+esc(plan.summary)+'</p>';
  html+='<div class="budget">';
  html+='<div class="bartrack"><div class="barfill'+(over?' over':'')+'" style="width:'+pct+'%"></div></div>';
  html+='<div class="line"><span>Estimated total: <b>'+money(cur,total)+'</b></span><span>Budget: <b>'+money(cur,budget)+'</b></span></div>';
  if(over) html+='<div class="line" style="color:var(--red)">Over budget by '+money(cur,total-budget)+' — try fewer days, a lower pace, or a higher budget.</div>';
  else if(budget) html+='<div class="line" style="color:var(--green)">'+money(cur,budget-total)+' left in budget.</div>';
  var bd=plan.budgetBreakdown||{};
  html+='<div class="breakdown">';
  ["flights","lodging","food","activities"].forEach(function(k){
    if(bd[k]!=null) html+='<span class="chip">'+k+': <b>'+money(cur,bd[k])+'</b></span>';
  });
  html+='</div></div></div>';

  // Days
  (plan.days||[]).forEach(function(d){
    html+='<div class="day"><div class="dnum">Day '+esc(d.day)+'</div><h3>'+esc(d.title||"")+'</h3>';
    (d.items||[]).forEach(function(it){
      var ico=ICONS[it.type]||"📍";
      html+='<div class="item">';
      html+='<div class="ico">'+ico+'</div>';
      html+='<div class="body"><div class="name">'+esc(it.name||"")+'</div>';
      if(it.detail) html+='<div class="detail">'+esc(it.detail)+'</div>';
      if(typeof it.cost==="number"&&it.cost>0) html+='<div class="cost">~'+money(cur,it.cost)+'</div>';
      else if(it.cost===0) html+='<div class="cost">Free</div>';
      html+='</div>';
      html+='<a class="book" target="_blank" rel="noopener" href="'+bookLink(it,dest,origin)+'">Book</a>';
      html+='</div>';
    });
    html+='</div>';
  });
  el("results").innerHTML=html;
}

function doPlan(){
  var destination=el("destination").value.trim();
  var origin=el("origin").value.trim();
  if(!destination){ setStatus("Enter a destination first."); return; }

  var payload={
    origin:origin, destination:destination,
    days:el("days").value, budget:el("budget").value,
    currency:el("currency").value, interests:selectedTags.join(", "),
    pace:el("pace").value, party:el("party").value
  };

  el("plan").disabled=true;
  el("results").innerHTML='<div class="spinner"></div>';
  setStatus("Building your "+destination+" itinerary… this can take ~15 seconds.");

  fetch("/.netlify/functions/plan",{
    method:"POST",
    headers:{"content-type":"application/json"},
    body:JSON.stringify(payload)
  })
  .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
  .then(function(res){
    if(!res.ok){
      el("results").innerHTML='<div class="empty">'+esc((res.j&&res.j.error)||"Something went wrong.")+'</div>';
      setStatus("");
      return;
    }
    renderPlan(res.j, destination, origin);
    setStatus("Done — tap any Book button for live prices.");
  })
  .catch(function(){
    el("results").innerHTML='<div class="empty">Couldn\'t reach the planner.<br>'+
      'If you\'re viewing this in a preview, deploy it to Netlify (with the function + API key) and it\'ll work.</div>';
    setStatus("");
  })
  .finally(function(){ el("plan").disabled=false; });
}

el("plan").onclick=doPlan;
</script>
</body>
</html>
